# カメラ（端末）の既定値と、フロア・ライブ表示の設定。バックエンド（Go）と worker（Python）が読む。
# ここに無い camera_id の接続は、バックエンドが拒否する。
# トラッカー・判定点・検出の最低スコアは matrix.yaml と同じ定義を使う。

defaults:
  sample_fps: 5          # ingest がデコード後に間引く、1秒あたりの枚数（端末は約5fpsで送る。2では足りない想定）
  tracker: lowfps        # matrix.yaml の aggregator.trackers の name
  anchor: bottom_center  # 線を越えたかを判定する、人の枠の位置。足元（既定。縦の線にも床の線にも使える）/ center（中心）/ top_center（頭）/ box（枠全体。枠が線をまたいだまま消える場所では数えられない）
  tiling: none           # none / 2x2 / line

# ライブ表示（管理画面で端末を選んで、その間だけ高い fps で見る）
live:
  normal_fps: 5          # ふだん端末が送る fps（送信ページの既定と合わせる）
  live_fps: 15           # ライブ表示中に、端末へ送ってもらう fps（スマホが熱くなるので 15。上げるほど滑らかだが、端末が熱くなる）
  max_seconds: 600       # 1回のライブ表示の上限（閉じ忘れで端末が 30fps のままにならないように）

# フロア人数の概算値の誤差の見積もり。通過 1 件あたり error_rate の割合だけ外れうると仮定して、
# 「補正してから今までの通過件数 × error_rate」を ± の範囲として出す（仮の値。実測で決める。仕様書8章の合格ライン ±20% が出所）
estimate:
  error_rate: 0.2

# フロアごとの混雑のしきい値（人数）。dashboard の色分けだけに使う（仮の値。実測で決める）
floors:
  1: {yellow: 10, red: 20}
  2: {yellow: 10, red: 20}

# スマホからは送信ページで登録する（DB に入る）。ここには固定のカメラ（テスト用など）を書く。
cameras:
  # 線は画面に対する割合 [x, y]（始点→終点）。IN の向きは、始点→終点に対して画面の左側。
  # 固定のカメラは、line:（1 本）または lines:（名前つきで複数）と書く。送信ページから登録した端末は、線を何本でも引ける。
  #
  # SAMPLE-1/2 は、サンプル動画（エレベーターホール）用。入口（階段室・エレベーター 2 基）の足元のすぐ下に、
  # ドアの縁と同じ傾きで、入口ごとに 1 本ずつ引いてある。人が入口に入るとき、足元がその線を越える。
  # （線の向き：始点が左、終点が右。入口へ入る＝画面の奥・上へ向かう動きが IN になる）
  - id: SAMPLE-1
    floor: 1
    lines:
      - {name: 階段の入口, line: [[0.70, 0.86], [0.98, 0.79]]}
      - {name: EV6の入口, line: [[0.50, 0.93], [0.65, 0.87]]}
      - {name: EV7の入口, line: [[0.10, 0.97], [0.36, 0.97]]}
  - id: SAMPLE-2
    floor: 2
    lines:
      - {name: 階段の入口, line: [[0.70, 0.86], [0.98, 0.79]]}
      - {name: EV6の入口, line: [[0.50, 0.93], [0.65, 0.87]]}
      - {name: EV7の入口, line: [[0.10, 0.97], [0.36, 0.97]]}
