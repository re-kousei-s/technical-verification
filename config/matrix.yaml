# 検証条件（Stage 0：PCでのオフライン比較）
# 検出（edge-device / server-model）と、追跡・判定（aggregator）は別々に回る。
# 検出側の条件（モデル・分割・間引き）を変えたら検出からやり直し、
# 追跡・線の条件（aggregator 以下）だけを変えたなら aggregator からやり直せばよい。

# 送信メッセージの ts の起点（動画の0秒がこの時刻になる）
ts_base: "2026-10-07T10:00:00+09:00"

# 動画は data/videos/ 以下に置く。line は画面に対する割合 [x, y]（0〜1）で、始点→終点。
# IN/OUT の向きは `aggregator/preview.py` で出る画像の矢印で確認する（矢印の向きに越えたら IN）。
videos:
  - id: sample_people_walking
    file: samples/people-walking.mp4
    camera_id: SAMPLE-1
    floor: 1
    line: [[0.0, 0.5], [1.0, 0.5]]
    scene: sample        # stair_narrow / stair_wide / ev_hall など
    crowd: normal        # empty / normal / crowded

sampling:
  # 1秒あたりの枚数。本番は 1〜2fps 想定、端末に余裕があれば 3〜5fps。
  # 0 = 全フレーム（上限の参考。RF-DETR は CPU で1枚0.7〜数秒かかるので長い動画では重い）
  fps: [1, 2, 3, 5]

tiling:
  modes: [none, 2x2, line]   # none / RxC（例 2x2）/ line（線の周りだけ切り出す）
  overlap: 0.15              # RxC のとき、隣のタイルと重ねる割合
  line_margin: 0.2           # line のとき、線の外側に足す余白（画面の縦横に対する割合）

detector:
  # 端末から送る最低スコア。ByteTrack は低スコアの検出も使うので低めに送り、
  # 実際の閾値は aggregator のトラッカー設定で振る（再推論が不要になる）
  min_score: 0.1

# 系統B：エッジ端末役（MediaPipe）
edge:
  models: [ssd_mobilenet_v2_fp32, efficientdet_lite0_int8, efficientdet_lite2_int8]

# 系統A：サーバー検出（RF-DETR、画像送信案のベースライン）
server:
  models: [rfdetr_nano, rfdetr_small, rfdetr_medium]

# ② 追跡 と ③ 判定（シンプル版。前の判定・追跡と、その設定は _unused/backup/judge_v1/ にある）
aggregator:
  # ② 追跡：前のフレームの人と、今回の枠を、中心どうしの距離だけでつなぐ（worker/aggregator/simple_tracker.py）
  tracker:
    max_dist: 1.2       # 同じ人とみなす距離の上限（その人の枠の高さの何倍か）。3fps だと、1 フレームで 0.3〜0.5 倍くらい動く。0.8 だと、追跡が切れやすかった
    lost_seconds: 1.0   # 見えなくなってから、同じ ID で待つ秒数
    min_score: 0.25     # これより低いスコアの枠は、使わない（暗い扉の中から出てくる人は 0.25〜0.4 くらい）
  # ③ 判定：線の両側に、タイルを 3 列ずつ自動で並べ、足元が踏んだ列の並びだけで決める（worker/aggregator/tile_judge.py の先頭に、決まりの説明）
  tiles:
    rows: 3             # 片側の列の数（扉の前・近く・遠く）
    cols: 4             # 線に沿って、何枚に分けるか（画面に描くだけ。判定には使わない）
    depth: 0.06         # 1 列の奥行き（画面の高さに対する割合）
    gap: 0.01           # 線のすぐそばの、タイルを置かない帯（画面の高さに対する割合）。広げると IN を落とす（扉から出てくる人は、線をわずかに越えたところで写り始める）
    extend: 0.25        # 線の両端より、外へ並べる長さ（線の長さに対する割合）
    vanish_seconds: 0.4 # 決まり 2：「近く → 扉の前」と来て、この秒数（3fps で 2 コマ）見えなければ、扉に入った
    appear_row: 1       # 決まり 3：扉の前（線のそば）で現れた人が、この列（0＝扉の前、1＝近く）まで離れたら、扉から出てきたとみなす
    born_row: 1         # 決まり 3：この列（0＝扉の前、1＝近く）までで初めて見えた人を、扉から出てきたかもしれない人とする（暗い扉の前では、検出されないことがある）
    hold_seconds: 2.0   # 決まり 1：越えた先が「扉の前」のときは仮の通過。この秒数とどまったら確定（近くへ進む・消えるでも確定。引き返したら数えない）
    shrink: 0.8         # 守り：枠が、直前のコマのこの倍より小さく、下から縮んだコマ（足元が隠れた）は、使わない
    shrink_top: 0.1     #   上の端の動きが、枠の高さのこの倍以内なら「下から縮んだ」とみなす（扉へ入って全体が小さくなる人は、使う）
    same_seconds: 2.0   # 守り：同じ人・同じ向きの通過は、線が違っても、この秒数に 1 回だけ（近くに引いた線のタイルが重なっても、2 回数えない）
    forget_seconds: 10  # この秒数見えない人の、踏んだタイルを忘れる

evaluation:
  # エッジ系の誤差を比べる基準（サーバー系）
  reference: {pipeline: server, model: rfdetr_medium}
  pass_error_pct: 20         # IN/OUT 誤差の合格ライン（±%）
  edge_vs_server_pt: 10      # エッジ系とサーバー系の誤差の差の許容（ポイント）
  frame_count_score: 0.4     # フレーム人数の比較で「検出あり」とみなすスコア
  # 間引きの影響（fps_consistency.csv）で、全フレームの通過イベントと同じとみなす範囲
  reference_tracker: bytetrack   # 基準（全フレーム）を数えるトラッカー
  match_max_seconds: 1.5
  match_max_px: 100
