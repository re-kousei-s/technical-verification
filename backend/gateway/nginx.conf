# スマホのブラウザは、カメラを使うページに HTTPS を要求する。管理画面のライブ表示（WebCodecs）も HTTPS が要る。
#   https://<このPCのIP>:8000（または 8443）→ backend:8000（スマホ：送信ページ・WebSocket・登録 API）
#   https://<このPCのIP>:8080（または 8444）→ backend:8080（管理画面：一覧・ライブ表示）
# 8000 / 8080 は、これまでの http:// の URL のまま、https になる。http:// で来た人は、同じポートの https:// へ転送する（497）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# どちらのサーバーも、同じ設定（証明書・WebSocket・長い接続）。違うのは、転送先だけ。
server {
    listen 8000 ssl;
    listen 8443 ssl;
    error_page 497 =301 https://$host:$server_port$request_uri;   # http:// で来たら、https:// に直す
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    resolver 127.0.0.11 valid=5s;       # backend を作り直してもつながるように、名前は都度引く（docker の内蔵 DNS）
    set $upstream http://backend:8000;
    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;   # WebSocket
        proxy_read_timeout 3600s;                          # 送信は長時間つながる
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 8080 ssl;
    listen 8444 ssl;
    error_page 497 =301 https://$host:$server_port$request_uri;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    resolver 127.0.0.11 valid=5s;
    set $upstream http://backend:8080;
    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
