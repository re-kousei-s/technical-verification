# 人検出・通過カウント：スマホ（H.264）→ backend（Go）→ キュー（Redis）→ worker（Python）→ DB（PostgreSQL）
#
#   docker compose --profile live up -d --build
#   スマホ : https://<このPCのIP>:8000       管理画面 : https://<このPCのIP>:8080（http:// で開いても、https:// に転送される）
#   テスト送信 : docker compose --profile stream run --rm stream-test
#
# 構成
#   backend  … Go。H.264 を受け、デコードして 5fps に間引きキューへ。ライブは H.264 をそのまま管理画面へ中継
#   worker   … Python。キューから取り出して検出・追跡・判定し、DB を更新
#   database … schema.sql（db-init が流す）      config … cameras.yaml / matrix.yaml
#   ネットワーク … 名前付き（hdt-net）。コンテナ同士はサービス名で通信し、外へ公開するのは gateway の 4 ポートだけ

services:
  redis:
    networks: [hdt]
    restart: unless-stopped   # PC を再起動しても、docker が起動したら、自動で立ち上がる（`docker compose stop` で止めたものは、止まったまま）
    image: redis:7-alpine
    profiles: ["live", "live-rfdetr"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # キューは揮発でよい（検証用）
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 10}

  postgres:
    networks: [hdt]
    restart: unless-stopped   # PC を再起動しても、docker が起動したら、自動で立ち上がる（`docker compose stop` で止めたものは、止まったまま）
    image: postgres:16-alpine
    profiles: ["live", "live-rfdetr"]
    environment:
      POSTGRES_USER: hdt
      POSTGRES_PASSWORD: hdt
      POSTGRES_DB: hdt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U hdt"], interval: 3s, timeout: 3s, retries: 10}

  # スキーマを流す（何度流しても同じになるように書いてある）。他のサービスは、これが終わってから起動する
  db-init:
    networks: [hdt]
    image: postgres:16-alpine
    profiles: ["live", "live-rfdetr"]
    environment: {PGPASSWORD: hdt}
    command: ["psql", "-h", "postgres", "-U", "hdt", "-d", "hdt", "-v", "ON_ERROR_STOP=1", "-f", "/schema.sql"]
    volumes:
      - ./database/schema.sql:/schema.sql:ro
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  backend:
    networks: [hdt]
    restart: unless-stopped   # PC を再起動しても、docker が起動したら、自動で立ち上がる（`docker compose stop` で止めたものは、止まったまま）
    build: {context: ./backend}
    image: hdt-backend
    profiles: ["live", "live-rfdetr"]
    environment: &env
      DATABASE_URL: postgresql://hdt:hdt@postgres:5432/hdt
      REDIS_URL: redis://redis:6379/0
      CAMERAS_PATH: /config/cameras.yaml
      PARTITIONS: "30"         # キューの分割数＝worker を増やせる上限。端末は、いちばん端末の少ない分割に、固定で振られる。worker は、分割を、自動で分け合う
      MAX_QUEUE: "200"         # キューの上限（超えたら新しいフレームを捨てる）
    volumes:
      - ./config:/config:ro
    depends_on:
      redis: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}

  # スマホ・管理画面用の HTTPS の入口（自己署名の証明書）。 8000（=8443）→ backend:8000 / 8080（=8444）→ backend:8080
  gateway:
    networks: [hdt]
    restart: unless-stopped   # PC を再起動しても、docker が起動したら、自動で立ち上がる（`docker compose stop` で止めたものは、止まったまま）
    build: {context: ./backend/gateway}
    image: hdt-gateway
    profiles: ["live", "live-rfdetr"]
    ports: ["8000:8000", "8080:8080", "8443:8443", "8444:8444"]
    depends_on: [backend]

  worker:
    networks: [hdt]
    restart: unless-stopped   # PC を再起動しても、docker が起動したら、自動で立ち上がる（`docker compose stop` で止めたものは、止まったまま）
    build: {context: ., dockerfile: worker/Dockerfile, args: {BACKEND: mediapipe}}
    image: hdt-worker-mediapipe
    profiles: ["live"]
    # worker の台数。増やすときは、`docker compose --profile live up -d --scale worker=4`（分割数 PARTITIONS が上限）。分割は、自動で分け合う
    deploy: {replicas: 30}   # 1 端末に 1 worker を割り当てられる台数（1 コア・1 スレッドの worker を、数で稼ぐ。コアが足りなければ、取り合って、全体が少し遅くなる）
    cpus: 1
    mem_limit: 1g
    environment: &worker-env
      <<: *env
      CONFIG: /config/matrix.yaml
      CAMERAS: /config/cameras.yaml
      MODELS_DIR: /models
      ORT_THREADS: "1"                        # 推論のスレッド数（1 コアの worker なので 1。1 スレッド × 多数のほうが、2 スレッドより、コアあたりの効率が良い）
      DETECTOR: yolox_tiny_416                # YOLOX-tiny（ONNX、Apache-2.0、入力 416）。人が大量にいても、Lite0 より強い。精度優先なら yolox_s_640、最軽量なら efficientdet_lite0_int8
      # WORKER_NAME は、指定しない（台数を増やしても、名前が重ならないよう、コンテナ名になる）。WORKER_PARTITIONS も、指定しない（自動で分け合う）
    volumes: &worker-volumes
      - ./config:/config:ro
      - ./worker/common:/app/common:ro
      - ./worker/aggregator:/app/aggregator:ro
      - ./worker/libs:/app/libs:ro
      - ./worker/worker.py:/app/worker.py:ro
      - ./worker/models:/models
    depends_on:
      redis: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}

  # 判定（画像を見ない）：worker（検出 + 追跡）が流した追跡の結果を読んで、線を越えたか（IN/OUT）を決め、DB と画面用の結果に書く。
  # 軽いので、1 つで、全部の分割を読む（名前を固定して、再起動しても、前回 ACK していない分を引き継ぐ）
  judge:
    networks: [hdt]
    image: hdt-worker-mediapipe
    command: ["python", "judge.py"]
    profiles: ["live", "live-rfdetr"]
    cpus: 1
    mem_limit: 1g
    environment: *worker-env
    volumes:
      - ./config:/config:ro
      - ./worker/common:/app/common:ro
      - ./worker/aggregator:/app/aggregator:ro
      - ./worker/libs:/app/libs:ro
      - ./worker/judge.py:/app/judge.py:ro
    depends_on:
      redis: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}
    restart: unless-stopped

  # RF-DETR で認識する版。`worker` と同じキューを取り合うので、どちらか一方だけ動かす
  worker-rfdetr:
    networks: [hdt]
    restart: unless-stopped   # PC を再起動しても、docker が起動したら、自動で立ち上がる（`docker compose stop` で止めたものは、止まったまま）
    build: {context: ., dockerfile: worker/Dockerfile, args: {BACKEND: rfdetr}}
    image: hdt-worker-rfdetr
    profiles: ["live-rfdetr"]
    cpus: 4
    mem_limit: 8g
    environment:
      <<: *worker-env
      DETECTOR: rfdetr_nano
      WORKER_NAME: worker-rfdetr
      OMP_NUM_THREADS: "4"
    volumes: *worker-volumes
    depends_on:
      redis: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}

  # テスト送信：動画ファイルを H.264 のストリームとして backend に流す（スマホの代わり）
  stream-test:
    networks: [hdt]
    build: {context: ./_unused/tools}
    image: hdt-tools
    profiles: ["stream"]
    volumes:
      - ./_unused/data:/data:ro
      - ./_unused/tools:/app:ro      # テスト用のスクリプトを直したら、ビルドし直さずに使える
    command: python stream_video.py /data/videos/samples/elevator_hall_h264_5fps.mp4 --url ws://backend:8000/ws/SAMPLE-1

# 全サービスを、この名前付きのネットワークにつなぐ。コンテナ同士は、サービス名で通信する（backend:8000、redis:6379、postgres:5432）。
# ホストへ公開するのは、gateway の ports（8000・8080・8443・8444）だけ。redis・postgres・backend は、外に出さない。
networks:
  hdt:
    name: hdt-net

volumes:
  pgdata:
